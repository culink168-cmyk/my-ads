<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dynamic Ad</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .ad-box {
    width: 100%;
    max-width: 100%;
    text-align: center;
    cursor: pointer;
  }
  .ad-box img, .ad-box video {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    object-fit: contain;
  }
</style>
</head>
<body>

  <!-- विज्ञापन पर क्लिक करने पर खुलने वाला लिंक -->
  <div class="ad-box" onclick="window.parent.location.href='https://wa.me/917877980508'">
    <!-- यहाँ इमेज लोड होगी -->
    <img id="adImage" alt="Election Poster" style="display:none;">
  </div>

  <script>
    // यहाँ अपना नया इमेज लिंक या फोटो का डायरेक्ट यूआरएल डालें
    const imageToLoad = "https://imgh.in/host/j1f2el";

    // यह फंक्शन ब्राउज़र और GitHub के कैशे को पूरी तरह चकमा देकर बिल्कुल नया वर्जन लोड करेगा
    function loadFreshImage() {
      const imgElement = document.getElementById('adImage');
      
      // यूआरएल में एक यूनिक रैंडम टोकन और टाइमस्टैम्प जोड़ रहे हैं
      const uniqueUrl = imageToLoad + (imageToLoad.includes('?') ? '&' : '?') + 'v=' + Date.now() + '_' + Math.random();

      // Fetch API का उपयोग करके सीधे फ्रेश बाइट्स मंगा रहे हैं ताकि कैशे का कोई चक्कर न रहे
      fetch(uniqueUrl, { cache: 'no-store' })
        .then(response => response.blob())
        .then(blob => {
          const objectURL = URL.createObjectURL(blob);
          imgElement.src = objectURL;
          imgElement.style.display = 'block';
        })
        .catch(error => {
          // अगर फेच में दिक्कत आए तो सीधे नॉर्मल नो-कैशे लिंक सेट कर दो
          imgElement.src = uniqueUrl;
          imgElement.style.display = 'block';
        });
    }

    window.onload = loadFreshImage;
  </script>

</body>
</html>
