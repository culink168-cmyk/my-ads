<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Ad</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .ad-box {
    width: 100%;
    max-width: 100%;
    text-align: center;
    cursor: pointer;
  }
  .ad-box img, .ad-box video {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    object-fit: contain;
  }
</style>
</head>
<body>

  <!-- यहाँ वह लिंक डालें जहाँ यूजर विज्ञापन पर क्लिक करने के बाद जाना चाहिए (जैसे WhatsApp, Telegram या वेबसाइट) -->
  <div class="ad-box" onclick="window.parent.location.href='https://wa.me/917877980508'">
    
    <!-- यहाँ अपने चुनावी पोस्टर या फोटो का डायरेक्ट इमेज लिंक डालें -->
    <img src="https://ibb.co/LzP1GJkg" alt="Election Poster">

    <!-- अगर आपको फोटो की जगह वीडियो दिखाना हो, तो ऊपर वाले <img> को हटाकर नीचे वाले कोड को चालू (uncomment) कर सकते हैं: -->
    <!-- 
    <video src="আপনার_वीडियो_लिंक.mp4" autoplay loop muted playsinline></video> 
    -->

  </div>

</body>
</html>
