<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Ad</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .ad-box {
    width: 100%;
    max-width: 100%;
    text-align: center;
    cursor: pointer;
  }
  .ad-box img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    object-fit: contain;
  }
</style>
</head>
<body>

  <!-- यहाँ https://wa.me/91 के बाद अपना पूरा व्हाट्सएप नंबर लिख लें -->
  <div class="ad-box" onclick="window.parent.location.href='https://wa.me/91आपका_व्हाट्सएप_नंबर'">
    
    <!-- आपका चुनावी पोस्टर कोड -->
    <a href="https://ibb.co/LzP1GJkg"><img src="https://i.ibb.co/TBTtCbv0/file-000000008c7081f5be1b2c52c1155f05.png" alt="Election Poster" border="0"></a>

  </div>

</body>
</html>
