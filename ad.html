<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dynamic Ad</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .ad-box {
    width: 100%;
    max-width: 100%;
    text-align: center;
    cursor: pointer;
  }
  .ad-box img, .ad-box video {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    object-fit: contain;
  }
</style>
</head>
<body>

  <!-- यहाँ वह लिंक डालें जहाँ यूजर विज्ञापन पर क्लिक करने के बाद जाना चाहिए -->
  <div class="ad-box" onclick="window.parent.location.href='https://wa.me/917877980508'">
    
    <!-- यहाँ अपने नए इमेज का डायरेक्ट लिंक डालें -->
    <img id="adImage" src="https://imgh.in/host/j1f2el" alt="Election Poster">

  </div>

  <script>
    // यह स्क्रिप्ट इमेज के लिंक में हर बार एक नया रैंडम नंबर जोड़ देगी ताकि ब्राउज़र या सर्वर पुरानी फाइल न उठाए
    window.addEventListener('DOMContentLoaded', (event) => {
      const img = document.getElementById('adImage');
      if (img) {
        let currentSrc = img.getAttribute('src');
        // अगर लिंक में पहले से ? या & है तो उसके हिसाब से पैरामीटर जोड़ें
        const separator = currentSrc.includes('?') ? '&' : '?';
        img.src = currentSrc + separator + 'nocache=' + new Date().getTime() + Math.random();
      }
    });
  </script>

</body>
</html>
